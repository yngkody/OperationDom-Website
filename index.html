<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OperationDom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* =========================
       Custom Font
    ========================== */
    @font-face {
      font-family: "Introvert";
      src: url("Introvert.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    :root{
      --ink: #ffffff;
      --bg: #000000;

      /* Glow palette (subtle) */
      --glow: rgba(200, 170, 255, 0.92);
      --glow-soft: rgba(200, 170, 255, 0.33);

      /* “Stamp” outline */
      --stamp-border: rgba(255,255,255,0.95);

      --shadow-light: #ffffff;
      --shadow-dark: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* =========================
       Page Background
    ========================== */
    body {
      min-height: 100vh;
      font-family: "Introvert", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);

      background: #000 url("hero-img-iv.png") center center / cover no-repeat fixed;
      overflow-x: hidden;
    }

    @media (max-width: 768px) {
      body {
        background: #000 url("dom-hero-mobile-v.png") center top / cover no-repeat scroll;
      }
    }

    /* =========================
       Hero Wrapper
    ========================== */
    .dom-hero {
      min-height: 100svh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* light vignette so buttons stay readable on busy hero */
    .dom-hero::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(60% 45% at 50% 70%,
          rgba(0,0,0,0.55) 0%,
          rgba(0,0,0,0.25) 45%,
          rgba(0,0,0,0.00) 78%);
      opacity: 0;
      transition: opacity 600ms ease;
    }
    body.is-ready .dom-hero::after { opacity: 1; }

    /* =========================
       Buttons Wrapper (Bottom Anchored)
    ========================== */
    .button-wrapper {
      margin-top: auto;
      margin-bottom: clamp(80px, 14vh, 140px);

      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: center;

      opacity: 0;
      transform: translateY(18px);
      filter: blur(2px);
    }

    body.is-ready .button-wrapper {
      animation: floatIn 720ms cubic-bezier(.2,.9,.2,1) forwards;
    }

    @keyframes floatIn {
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* =========================
       Base Button
    ========================== */
    .btn {
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Introvert", sans-serif;
      letter-spacing: 0.06em;
      cursor: pointer;
      border-radius: 0;
      border: 0;
      background: transparent;
      color: var(--ink);

      padding: 28px 110px;
      font-size: 32px;
      line-height: 34px;
      white-space: nowrap;

      position: relative;
      transform: translateZ(0);
      will-change: transform;

      transition:
        transform 160ms cubic-bezier(.2,.9,.2,1),
        filter 200ms ease,
        box-shadow 200ms ease,
        background-color 200ms ease,
        color 200ms ease,
        border-color 200ms ease;
    }

    /* Stagger entrance */
    body.is-ready .btn {
      opacity: 0;
      transform: translateY(14px);
      animation: btnIn 760ms cubic-bezier(.2,.9,.2,1) forwards;
    }
    body.is-ready .btn:nth-child(1){ animation-delay: 140ms; }
    body.is-ready .btn:nth-child(2){ animation-delay: 260ms; }

    @keyframes btnIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* =========================
       Dominique Smith (Stamp / Outline)
    ========================== */
    .btn-stamp {
      border: 3px solid var(--stamp-border);
      color: var(--ink);
      background: rgba(0,0,0,0.12);

      box-shadow: var(--shadow-light) 8px 8px 0 0, var(--shadow-dark) 8px 8px 0 1px;
    }

    @media (hover: hover) and (pointer: fine) {
      .btn-stamp:hover{
        transform: translateY(-4px);
        box-shadow: var(--shadow-light) 10px 10px 0 0, var(--shadow-dark) 10px 10px 0 1px;
        filter: drop-shadow(0 0 12px rgba(255,255,255,0.12));
      }
    }

    .btn-stamp:active{
      transform: translate(4px, 4px);
      box-shadow: var(--shadow-light) 4px 4px 0 0, var(--shadow-dark) 4px 4px 0 1px;
    }

    /* tiny “printed” wobble (very subtle, only once) */
    body.is-ready .btn-stamp{
      animation:
        btnIn 760ms cubic-bezier(.2,.9,.2,1) forwards,
        stampWobble 520ms ease 950ms 1;
    }
    @keyframes stampWobble{
      0%   { transform: translateY(0) rotate(0deg); }
      35%  { transform: translateY(-1px) rotate(-0.6deg); }
      70%  { transform: translateY(0) rotate(0.5deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* =========================
       OperationDom (Subtle Glow / Premium)
    ========================== */
    .btn-glow {
      border: 2px solid var(--glow);
      color: var(--glow);
      background: rgba(0,0,0,0.55);
      overflow: hidden;
      isolation: isolate;

      box-shadow:
        0 0 12px var(--glow-soft),
        inset 0 0 7px rgba(255,255,255,0.12);
      text-shadow: 0 0 6px rgba(200,170,255,0.28);
    }

    /* chrome sweep */
    .btn-glow::before{
      content:"";
      position:absolute;
      inset:-40%;
      background: linear-gradient(
        120deg,
        transparent 35%,
        rgba(255,255,255,0.40) 50%,
        transparent 65%
      );
      transform: translateX(-125%);
      opacity: 0;
      pointer-events:none;
      mix-blend-mode: screen;
      will-change: transform, opacity;
    }

    @media (hover: hover) and (pointer: fine) {
      .btn-glow:hover{
        transform: translateY(-4px);
        background: rgba(200,170,255,0.92);
        color: #000;
        text-shadow: none;
        box-shadow:
          0 0 18px var(--glow-soft),
          0 0 34px rgba(200,170,255,0.22),
          inset 0 0 0 rgba(0,0,0,0);
      }

      .btn-glow:hover::before,
      .btn-glow:focus-visible::before{
        animation: shine 900ms ease forwards;
      }
    }

    .btn-glow:active{
      transform: translateY(2px);
      box-shadow: 0 0 8px var(--glow-soft);
    }

    @keyframes shine{
      0%   { transform: translateX(-125%); opacity: 0; }
      15%  { opacity: 1; }
      100% { transform: translateX(125%); opacity: 0; }
    }

    /* gentle “breathe” so it stays alive without screaming */
    body.is-ready .btn-glow{
      animation:
        btnIn 760ms cubic-bezier(.2,.9,.2,1) forwards,
        breathe 2400ms ease-in-out 1100ms infinite;
    }

    @keyframes breathe{
      0%, 100% { filter: drop-shadow(0 0 0 rgba(200,170,255,0)); }
      50%      { filter: drop-shadow(0 0 14px rgba(200,170,255,0.16)); }
    }

    /* =========================
       Layout Breakpoints
    ========================== */
    @media (min-width: 1024px) {
      .button-wrapper {
        flex-direction: row;
        margin-bottom: clamp(44px, 6vh, 86px);
      }
    }

    @media (max-width: 768px) {
      .dom-hero { padding-top: 12px; }

      .btn{
        padding: 20px 44px;
        font-size: 22px;
        line-height: 24px;
      }

      .btn-stamp{
        box-shadow: var(--shadow-light) 6px 6px 0 0, var(--shadow-dark) 6px 6px 0 1px;
      }
    }

    @media (max-width: 480px) {
      .button-wrapper {
        width: 100%;
        padding-inline: 12px;
        margin-bottom: 24px;
      }
      .btn { width: 100%; text-align: center; }
    }

    /* =========================
       Optional: subtle background drift
    ========================== */
    body.is-ready {
      animation: bgDrift 14s ease-in-out infinite alternate;
    }
    @keyframes bgDrift {
      from { background-position: 50% 50%; }
      to   { background-position: 50% 46%; }
    }

    /* =========================
       Accessibility: Reduce Motion
    ========================== */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .button-wrapper, .btn { opacity: 1 !important; transform: none !important; filter: none !important; }
      .btn-glow::before { display: none !important; }
    }
  </style>
</head>

<body>
  <header class="dom-hero">
    <div class="button-wrapper">
      <button class="btn btn-stamp" onclick="location.href='dominiquesmith.html'">
        Dominique Smith
      </button>

      <button class="btn btn-glow" id="ctaBtn" onclick="location.href='operationdom.html'">
        OperationDom
      </button>
    </div>
  </header>

  <script>
    // turn on animations after first paint (prevents janky load)
    requestAnimationFrame(() => document.body.classList.add("is-ready"));

    // Auto-sweep the CTA occasionally (subtle)
    const cta = document.getElementById("ctaBtn");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (cta && !reduceMotion) {
      setInterval(() => {
        // retrigger shine by toggling hover-like animation via class
        cta.classList.remove("shine");
        void cta.offsetWidth;
        cta.classList.add("shine");
        // run the sweep via the pseudo element on class toggle:
        // easiest: dispatch a fake hover by just re-adding class and letting keyframes run
        cta.style.setProperty("--_shine", Date.now());
      }, 5400);

      // Add a real class to trigger the pseudo animation
      // (We do this by temporarily adding a class and removing it after)
      setInterval(() => {
        cta.classList.add("pulse-shine");
        setTimeout(() => cta.classList.remove("pulse-shine"), 950);
      }, 5400);
    }
  </script>

  <style>
    /* class-driven sweep trigger */
    .btn-glow.pulse-shine::before {
      animation: shine 900ms ease forwards;
    }
  </style>
</body>
</html>
