<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OperationDom – Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "Introvert";
      src: url("Introvert.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }

    :root {
      --accent-green: #22c55e;
      --accent-green-soft: rgba(34, 197, 94, 0.16);
      --ink: #ffffff;
      --muted-ink: rgba(255, 255, 255, 0.85);
      --panel-bg: rgba(0, 0, 0, 0.94);
      --border-strong: #ffffff;
    }

    body {
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(34,197,94,0.18), transparent 55%),
        radial-gradient(900px 600px at 85% 25%, rgba(255,255,255,0.08), transparent 55%),
        #000;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* NAV */
    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;

      display: flex;
      justify-content: center;
      gap: 32px;
      padding: 14px 20px;

      background: rgba(0, 0, 0, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);

      padding-top: calc(14px + env(safe-area-inset-top));
    }

    .site-nav a, .site-nav button {
      font-family: "Shrikhand", system-ui, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;

      padding: 8px 10px;
      border-radius: 999px;

      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);

      transition: border-color 0.15s ease-out, color 0.15s ease-out, transform 0.1s ease-out, background 0.15s ease-out;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .site-nav a:hover, .site-nav button:hover {
      color: var(--accent-green);
      border-color: var(--accent-green);
      transform: translateY(-1px);
      background: rgba(255,255,255,0.06);
    }

    @media (max-width: 700px) {
      .site-nav {
        justify-content: flex-start;
        gap: 10px;
        padding: calc(10px + env(safe-area-inset-top)) 10px 10px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .site-nav::-webkit-scrollbar{ display:none; }

      .site-nav a, .site-nav button {
        flex: 0 0 auto;
        white-space: nowrap;
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.18);
      }
    }

    .cart-badge {
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "DM Sans", system-ui, sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      background: var(--accent-green);
      color: #000;
      border: 1px solid rgba(0,0,0,0.5);
    }

    /* SECTION */
    .section {
      min-height: 100vh;
      padding: 120px 16px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-inner {
      width: min(1200px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section-title {
      font-family: "Introvert", system-ui, sans-serif;
      font-size: clamp(2.6rem, 4.2vw, 3.4rem);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      margin: 0;
    }

    .section-subtitle {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--muted-ink);
      max-width: 780px;
      margin: 0;
    }

    /* TOP BAR */
    .shop-topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
      margin-top: 6px;
    }
    @media (max-width: 820px){
      .shop-topbar { grid-template-columns: 1fr; align-items: stretch; }
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    @media (max-width: 820px){ .controls { justify-content: flex-start; } }

    .control {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.92);
      box-shadow: #ffffff 4px 4px 0 0, #000000 4px 4px 0 1px;
    }

    .control label{
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
    }

    .control input, .control select{
      border: 0;
      outline: none;
      background: transparent;
      color: #fff;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 800;
      min-width: 180px;
    }
    .control input::placeholder{ color: rgba(255,255,255,0.55); }

    /* GRID */
    .grid-wrap {
      background: var(--panel-bg);
      border-radius: 14px;
      border: 2px solid var(--border-strong);
      box-shadow: 0 18px 60px rgba(0,0,0,0.9);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .grid-wrap::after{
      content:"";
      position:absolute;
      inset: 10px;
      border-radius: 12px;
      border: 1px solid var(--accent-green-soft);
      pointer-events:none;
    }

    .grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 14px;
    }

    .product {
      grid-column: span 4;
      background: rgba(0,0,0,0.96);
      border: 2px solid rgba(255,255,255,0.85);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: #ffffff 5px 5px 0 0, #000000 5px 5px 0 1px;
      transition: transform .1s ease-out, box-shadow .1s ease-out, border-color .1s ease-out;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .product:hover{
      transform: translate(-2px,-2px);
      box-shadow: #ffffff 7px 7px 0 0, #000000 7px 7px 0 1px;
      border-color: var(--accent-green);
    }

    .product-media{
      aspect-ratio: 4/3;
      border-bottom: 1px solid rgba(255,255,255,0.14);
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .product-media img{
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-body{
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .product-title{
      font-family: "Introvert", system-ui, sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin: 0;
      line-height: 1.15;
    }

    .product-desc{
      margin: 0;
      color: var(--muted-ink);
      font-weight: 700;
      line-height: 1.35;
      font-size: 0.98rem;
      min-height: 2.7em;
    }

    .product-meta{
      display:flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.10);
    }

    .price{
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
    }

    .chip{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--accent-green-soft);
      color: rgba(255,255,255,0.85);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }

    .product-actions{
      display:flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn{
      flex: 1;
      padding: 14px 14px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.92);
      color:#fff;
      font-family:"DM Sans", system-ui, sans-serif;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor:pointer;
      box-shadow: #ffffff 5px 5px 0 0, #000000 5px 5px 0 1px;
      transition: transform .1s ease-out, box-shadow .1s ease-out, border-color .1s ease-out, background .1s ease-out, color .1s ease-out;
    }

    .btn.primary{
      background:#fff;
      color:#000;
      border-color:#fff;
      box-shadow: var(--accent-green) 0 0 0 1px, #ffffff 5px 5px 0 0, #000000 5px 5px 0 1px;
    }

    .btn:hover{
      transform: translate(-2px,-2px);
      box-shadow: #ffffff 7px 7px 0 0, #000000 7px 7px 0 1px;
      border-color: var(--accent-green);
    }

    .btn.primary:hover{
      background:#000;
      color:#fff;
      border-color:#fff;
      box-shadow: var(--accent-green) 0 0 0 1px, #ffffff 7px 7px 0 0, #000000 7px 7px 0 1px;
    }

    @media (max-width: 1020px){
      .product{ grid-column: span 6; }
    }
    @media (max-width: 650px){
      .product{ grid-column: span 12; }
      .section{ padding-top: 130px; }
    }
  </style>
</head>

<body>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="index.html#booking">Booking</a>
    <a href="index.html#music-section">Music</a>
    <a href="index.html#socials">Socials</a>
    <button id="cartBtn" type="button">Cart <span id="cartCount" class="cart-badge">0</span></button>
  </nav>

  <section class="section" id="shop">
    <div class="section-inner">
      <h1 class="section-title">Shop</h1>
      <p class="section-subtitle">Mock products for now. Swap these out later with real Stripe Price IDs.</p>

      <div class="shop-topbar">
        <div class="control" style="justify-content:flex-start;">
          <label for="search">Search</label>
          <input id="search" type="search" placeholder="hoodie, tee, poster..." autocomplete="off" />
        </div>

        <div class="controls">
          <div class="control">
            <label for="category">Category</label>
            <select id="category">
              <option value="all">All</option>
            </select>
          </div>

          <div class="control">
            <label for="sort">Sort</label>
            <select id="sort">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: Low → High</option>
              <option value="price-desc">Price: High → Low</option>
              <option value="name-asc">Name: A → Z</option>
            </select>
          </div>
        </div>
      </div>

      <!-- THIS MUST EXIST OR NOTHING RENDERS -->
      <div class="grid-wrap">
        <div id="grid" class="grid"></div>
      </div>
    </div>
  </section>

  <script>
    // Placeholder image generator (so mock products show even with no local images)
    function placeholderDataUri(text) {
      const safe = String(text).slice(0, 22).replace(/[<>&"]/g, "");
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0a0a0a"/>
              <stop offset="1" stop-color="#111827"/>
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#g)"/>
          <circle cx="240" cy="220" r="160" fill="rgba(34,197,94,0.18)"/>
          <circle cx="940" cy="520" r="220" fill="rgba(255,255,255,0.08)"/>
          <text x="60" y="520" font-family="DM Sans, Arial" font-weight="800" font-size="78" fill="#ffffff" opacity="0.95" letter-spacing="6">
            ${safe.toUpperCase()}
          </text>
          <text x="60" y="600" font-family="DM Sans, Arial" font-weight="700" font-size="34" fill="rgba(255,255,255,0.72)" letter-spacing="3">
            OPERATIONDOM • MOCK PRODUCT
          </text>
        </svg>
      `.trim();
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    const PRODUCTS = [
      { id: "tee", name: "OperationDom Tee", desc: "Heavyweight tee. Clean print.", price: 3500, category: "Apparel", image: placeholderDataUri("Tee") },
      { id: "hoodie", name: "Green Light Hoodie", desc: "Soft fleece. Oversized fit.", price: 7500, category: "Apparel", image: placeholderDataUri("Hoodie") },
      { id: "cap", name: "OD Cap", desc: "Simple mark. Everyday wear.", price: 2800, category: "Accessories", image: placeholderDataUri("Cap") },
      { id: "poster", name: "Show Poster (Limited)", desc: "High-gloss print.", price: 2200, category: "Prints", image: placeholderDataUri("Poster") },
      { id: "stickers", name: "Sticker Pack", desc: "Laptop / case / mic stand.", price: 900, category: "Accessories", image: placeholderDataUri("Stickers") },
      { id: "download", name: "Digital Download", desc: "Instant download.", price: 1200, category: "Digital", image: placeholderDataUri("Digital") },
    ];

    function money(cents){
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(cents / 100);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("grid");
      const search = document.getElementById("search");
      const category = document.getElementById("category");
      const sort = document.getElementById("sort");

      if (!grid) {
        console.error("Missing #grid element. Products cannot render.");
        return;
      }

      // categories
      const cats = ["all", ...Array.from(new Set(PRODUCTS.map(p => p.category)))];
      category.innerHTML = cats.map(c => `<option value="${c}">${c === "all" ? "All" : c}</option>`).join("");

      function getList(){
        const q = (search.value || "").trim().toLowerCase();
        const cat = category.value;
        let list = PRODUCTS.slice();

        if (cat !== "all") list = list.filter(p => p.category === cat);
        if (q) {
          list = list.filter(p =>
            p.name.toLowerCase().includes(q) ||
            p.desc.toLowerCase().includes(q) ||
            p.category.toLowerCase().includes(q)
          );
        }

        const s = sort.value;
        if (s === "price-asc") list.sort((a,b) => a.price - b.price);
        if (s === "price-desc") list.sort((a,b) => b.price - a.price);
        if (s === "name-asc") list.sort((a,b) => a.name.localeCompare(b.name));
        return list;
      }

      function render(){
        const list = getList();
        if (!list.length) {
          grid.innerHTML = `<div style="grid-column: span 12; padding:14px; border:1px dashed rgba(255,255,255,0.25); border-radius:12px; background:rgba(255,255,255,0.04); color:rgba(255,255,255,0.8); font-weight:700;">No matches.</div>`;
          return;
        }

        grid.innerHTML = list.map(p => `
          <article class="product">
            <div class="product-media">
              <img src="${p.image}" alt="${p.name}">
            </div>

            <div class="product-body">
              <h3 class="product-title">${p.name}</h3>
              <p class="product-desc">${p.desc}</p>

              <div class="product-meta">
                <span class="price">${money(p.price)}</span>
                <span class="chip">${p.category}</span>
              </div>

              <div class="product-actions">
                <button class="btn primary" type="button" data-add="${p.id}">Add to cart</button>
                <button class="btn" type="button" data-buy="${p.id}">Buy now</button>
              </div>
            </div>
          </article>
        `).join("");

        // mock actions for now
        grid.querySelectorAll("[data-add]").forEach(btn => {
          btn.addEventListener("click", () => alert("Mock: added to cart → " + btn.dataset.add));
        });
        grid.querySelectorAll("[data-buy]").forEach(btn => {
          btn.addEventListener("click", () => alert("Mock: buy now → " + btn.dataset.buy));
        });
      }

      render();
      search.addEventListener("input", render);
      category.addEventListener("change", render);
      sort.addEventListener("change", render);
    });
  </script>
</body>
</html>
