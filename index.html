<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OperationDom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* =========================
       Custom Font
    ========================== */
    @font-face {
      font-family: "Introvert";
      src: url("Introvert.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --border-color: #ffffff;
      --text-color: #ffffff;
      --bg-color: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* =========================
       Page Background
    ========================== */
    body {
      min-height: 100vh;
      font-family: "Introvert", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text-color);

      background-image: url("hero-img-iv.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;

      overflow-x: hidden;
    }

    /* Mobile hero image */
    @media (max-width: 768px) {
      body {
        background-image: url("dom-hero-mobile-v.png");
        background-attachment: scroll;
        background-position: center top;
      }
    }

    /* =========================
       Hero Wrapper
    ========================== */
    .dom-hero {
      min-height: 100svh;
      padding: 24px;

      display: flex;
      flex-direction: column;
      align-items: center;

      position: relative;
    }

    /* =========================
       Button Section (Bottom Anchored)
    ========================== */
    .button-wrapper {
      margin-top: auto;
      margin-bottom: clamp(80px, 14vh, 140px);

      display: flex;
      flex-direction: column; /* mobile default */
      gap: 24px;
      align-items: center;

      /* entrance animation */
      opacity: 0;
      transform: translateY(18px);
    }

    /* When page is ready */
    body.is-ready .button-wrapper {
      animation: floatIn 700ms cubic-bezier(.2,.9,.2,1) forwards;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(2px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .hero-btn {
      background: transparent;
      border: 3px solid var(--border-color);
      color: var(--text-color);

      padding: 28px 110px;
      font-size: 32px;
      line-height: 34px;
      letter-spacing: 0.06em;

      font-family: "Introvert";
      cursor: pointer;
      border-radius: 0;

      box-shadow: #ffffff 8px 8px 0 0, #000000 8px 8px 0 1px;
      transition:
        transform 160ms cubic-bezier(.2,.9,.2,1),
        box-shadow 160ms cubic-bezier(.2,.9,.2,1),
        filter 160ms ease,
        background-color 160ms ease,
        color 160ms ease;

      white-space: nowrap;
      will-change: transform;
      transform: translateZ(0);
    }

    /* Stagger entrance (each button floats in slightly after) */
    body.is-ready .hero-btn {
      opacity: 0;
      transform: translateY(16px);
      animation: btnIn 720ms cubic-bezier(.2,.9,.2,1) forwards;
    }
    body.is-ready .hero-btn:nth-child(1) { animation-delay: 120ms; }
    body.is-ready .hero-btn:nth-child(2) { animation-delay: 220ms; }

    @keyframes btnIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Desktop hover feels "alive" */
    @media (hover: hover) and (pointer: fine) {
      .hero-btn:hover {
        transform: translateY(-4px);
        box-shadow: #ffffff 10px 10px 0 0, #000000 10px 10px 0 1px;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.12));
      }

      .hero-btn:focus-visible {
        outline: none;
        filter: drop-shadow(0 0 14px rgba(255,255,255,0.18));
      }
    }

    .hero-btn:active {
      box-shadow: #ffffff 4px 4px 0 0, #000000 4px 4px 0 1px;
      transform: translate(4px, 4px);
    }

    .hero-btn.filled {
      background: #000000;
      color: #ffffff;
      border: 3px solid #ffffff;
      position: relative;
    }

    /* Subtle "breathing" glow for the filled CTA */
    body.is-ready .hero-btn.filled {
      animation:
        btnIn 720ms cubic-bezier(.2,.9,.2,1) forwards,
        breathe 2200ms ease-in-out 900ms infinite;
    }

    @keyframes breathe {
      0%, 100% {
        filter: drop-shadow(0 0 0 rgba(255,255,255,0));
      }
      50% {
        filter: drop-shadow(0 0 14px rgba(255,255,255,0.18));
      }
    }

    /* =========================
       DESKTOP: buttons side-by-side
    ========================== */
    @media (min-width: 1024px) {
      .button-wrapper {
        flex-direction: row;
        margin-bottom: clamp(40px, 6vh, 80px);
      }
    }

    /* Tablet */
    @media (max-width: 768px) {
      .hero-btn {
        padding: 20px 40px;
        font-size: 22px;
        line-height: 24px;
        box-shadow: #ffffff 6px 6px 0 0, #000000 6px 6px 0 1px;
      }

      .dom-hero {
        padding-top: 12px;
      }
    }

    /* Small Mobile */
    @media (max-width: 480px) {
      .button-wrapper {
        width: 100%;
        padding-inline: 12px;
        margin-bottom: 24px;
      }

      .hero-btn {
        width: 100%;
        text-align: center;
      }
    }

    /* =========================
       Optional: subtle background drift
       (remove if you want it static)
    ========================== */
    body.is-ready {
      animation: bgDrift 14s ease-in-out infinite alternate;
    }

    @keyframes bgDrift {
      from { background-position: 50% 50%; }
      to   { background-position: 50% 46%; }
    }

    /* =========================
       Accessibility: Reduce Motion
    ========================== */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      .button-wrapper,
      .hero-btn {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="dom-hero">
    <div class="button-wrapper">
      <button class="hero-btn" onclick="location.href='dominiquesmith.html'">
        Dominique Smith
      </button>

      <button class="hero-btn filled" onclick="location.href='operationdom.html'">
        OperationDom
      </button>
    </div>
  </header>

  <script>
    // Flip on animations after first paint (prevents janky load)
    requestAnimationFrame(() => {
      document.body.classList.add("is-ready");
    });
  </script>
</body>
</html>
