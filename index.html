<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OperationDom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    @font-face {
      font-family: "Introvert";
      src: url("Introvert.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --border-color: #ffffff;
      --text-color: #ffffff;
      --bg-color: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Introvert", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-color);

      background-image: url("hero-img-iv.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;

      overflow-x: hidden;
    }

    @media (max-width: 768px) {
      body {
        background-image: url("dom-hero-mobile-v.png");
        background-attachment: scroll;
        background-position: center top;
      }
    }

    .dom-hero {
      min-height: 100svh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .button-wrapper {
      margin-top: auto;
      margin-bottom: clamp(80px, 14vh, 140px);

      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;

      opacity: 0;
      transform: translateY(18px);
    }

    body.is-ready .button-wrapper {
      animation: floatIn 700ms cubic-bezier(.2,.9,.2,1) forwards;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(18px); filter: blur(2px); }
      to   { opacity: 1; transform: translateY(0);  filter: blur(0); }
    }

    .hero-btn {
      background: transparent;
      border: 3px solid var(--border-color);
      color: var(--text-color);

      padding: 28px 110px;
      font-size: 32px;
      line-height: 34px;
      letter-spacing: 0.06em;

      font-family: "Introvert";
      cursor: pointer;
      border-radius: 0;

      box-shadow: #ffffff 8px 8px 0 0, #000000 8px 8px 0 1px;
      transition:
        transform 160ms cubic-bezier(.2,.9,.2,1),
        box-shadow 160ms cubic-bezier(.2,.9,.2,1),
        filter 160ms ease,
        background-color 160ms ease,
        color 160ms ease;

      white-space: nowrap;
      will-change: transform;
      transform: translateZ(0);
    }

    /* Stagger entrance */
    body.is-ready .hero-btn {
      opacity: 0;
      transform: translateY(16px);
      animation: btnIn 720ms cubic-bezier(.2,.9,.2,1) forwards;
    }
    body.is-ready .hero-btn:nth-child(1) { animation-delay: 120ms; }
    body.is-ready .hero-btn:nth-child(2) { animation-delay: 220ms; }

    @keyframes btnIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (hover: hover) and (pointer: fine) {
      .hero-btn:hover {
        transform: translateY(-4px);
        box-shadow: #ffffff 10px 10px 0 0, #000000 10px 10px 0 1px;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.12));
      }
      .hero-btn:focus-visible {
        outline: none;
        filter: drop-shadow(0 0 14px rgba(255,255,255,0.18));
      }
    }

    .hero-btn:active {
      box-shadow: #ffffff 4px 4px 0 0, #000000 4px 4px 0 1px;
      transform: translate(4px, 4px);
    }

    .hero-btn.filled {
      background: #000000;
      color: #ffffff;
      border: 3px solid #ffffff;
      position: relative;

      /* needed for the chrome overlay */
      overflow: hidden;
      isolation: isolate; /* makes overlay blend cleanly */
    }

    /* Soft “breathe” glow */
    body.is-ready .hero-btn.filled {
      animation:
        btnIn 720ms cubic-bezier(.2,.9,.2,1) forwards,
        breathe 2200ms ease-in-out 900ms infinite;
    }

    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
      50%      { filter: drop-shadow(0 0 14px rgba(255,255,255,0.18)); }
    }

    /* =========================
       Chrome Sweep (Shine)
    ========================== */
    .hero-btn.filled::before {
      content: "";
      position: absolute;
      inset: -40% -60%; /* oversized so it can sweep across */
      transform: translateX(-60%) rotate(18deg);

      background: linear-gradient(
        90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.18) 35%,
        rgba(255,255,255,0.55) 50%,
        rgba(255,255,255,0.18) 65%,
        rgba(255,255,255,0) 100%
      );

      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      will-change: transform, opacity;
    }

    /* trigger on hover/focus */
    @media (hover: hover) and (pointer: fine) {
      .hero-btn.filled:hover::before,
      .hero-btn.filled:focus-visible::before {
        animation: shine 900ms cubic-bezier(.2,.9,.2,1) forwards;
      }
    }

    /* trigger periodically via JS (class toggle) */
    .hero-btn.filled.shine::before {
      animation: shine 900ms cubic-bezier(.2,.9,.2,1) forwards;
    }

    @keyframes shine {
      0%   { opacity: 0; transform: translateX(-70%) rotate(18deg); }
      10%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(70%) rotate(18deg); }
    }

    @media (min-width: 1024px) {
      .button-wrapper {
        flex-direction: row;
        margin-bottom: clamp(40px, 6vh, 80px);
      }
    }

    @media (max-width: 768px) {
      .hero-btn {
        padding: 20px 40px;
        font-size: 22px;
        line-height: 24px;
        box-shadow: #ffffff 6px 6px 0 0, #000000 6px 6px 0 1px;
      }
      .dom-hero { padding-top: 12px; }
    }

    @media (max-width: 480px) {
      .button-wrapper {
        width: 100%;
        padding-inline: 12px;
        margin-bottom: 24px;
      }
      .hero-btn { width: 100%; text-align: center; }
    }

    /* subtle bg drift (optional) */
    body.is-ready { animation: bgDrift 14s ease-in-out infinite alternate; }
    @keyframes bgDrift {
      from { background-position: 50% 50%; }
      to   { background-position: 50% 46%; }
    }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .button-wrapper, .hero-btn { opacity: 1 !important; transform: none !important; filter: none !important; }
      .hero-btn.filled::before { display: none !important; }
    }
  </style>
</head>

<body>
  <header class="dom-hero">
    <div class="button-wrapper">
      <button class="hero-btn" onclick="location.href='dominiquesmith.html'">
        Dominique Smith
      </button>

      <button class="hero-btn filled" id="ctaBtn" onclick="location.href='operationdom.html'">
        OperationDom
      </button>
    </div>
  </header>

  <script>
    // Enable entrance animations after first paint
    requestAnimationFrame(() => document.body.classList.add("is-ready"));

    // Auto-sweep the CTA every few seconds (subtle)
    const cta = document.getElementById("ctaBtn");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (cta && !reduceMotion) {
      setInterval(() => {
        cta.classList.remove("shine"); // reset if it was mid-animation
        // force reflow so animation can retrigger
        void cta.offsetWidth;
        cta.classList.add("shine");
      }, 5200);
    }
  </script>
</body>
</html>
